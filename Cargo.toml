[package]
name = "phi-agent"
version = "0.3.0"
edition = "2024"
description = "phi-agent — General-purpose AI Agent framework (builder factory, renderer, config, session management)"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-agent"
readme = "README.md"
keywords = ["agent", "ai", "llm", "framework", "cli"]
categories = ["development-tools", "command-line-utilities", "asynchronous"]

[[bin]]
name = "phi"
path = "src/bin/phi/main.rs"
required-features = ["tools", "telemetry", "logging"]

[dependencies]
agent-base = "0.1.12"
agent-works = "0.1.5"
phi-kernel-tools = { version = "0.1.0" }
phi-tools = { version = "0.1.4", optional = true }
phi-telemetry = { version = "0.1.4", optional = true }
log-core = { version = "0.1.3", optional = true }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
rustyline = "15"

[features]
default = ["tools", "telemetry", "logging", "multi-agent", "skill"]
tools = ["phi-tools"]
telemetry = ["phi-telemetry"]
logging = ["log-core"]
browser = ["tools", "phi-tools/browser"]
mcp = ["agent-works/mcp"]
multi-agent = ["phi-kernel-tools/multi-agent"]
skill = ["phi-kernel-tools/skill", "agent-works/skill"]

[dev-dependencies]
tempfile = "3"
futures-core = "0.3"

# ── Examples ──

[[example]]
name = "hello_agent"
path = "examples/minimal/hello_agent.rs"

[[example]]
name = "custom_tool"
path = "examples/tools/custom_tool.rs"

[[example]]
name = "custom_policy"
path = "examples/tools/custom_policy.rs"

[[example]]
name = "multi_tool"
path = "examples/tools/multi_tool.rs"

[[example]]
name = "focus_demo"
path = "examples/advanced/focus_demo.rs"

[[example]]
name = "html_renderer"
path = "examples/observability/html_renderer.rs"

# ── Phase 2: new examples ──

[[example]]
name = "mcp_client"
path = "examples/mcp/mcp_client.rs"
required-features = ["mcp"]

[[example]]
name = "mcp_dynamic_attach"
path = "examples/mcp/mcp_dynamic_attach.rs"
required-features = ["mcp"]

[[example]]
name = "session_persist"
path = "examples/session/session_persist.rs"

[[example]]
name = "event_log"
path = "examples/observability/event_log.rs"

[[example]]
name = "middleware_hooks"
path = "examples/observability/middleware_hooks.rs"

[[example]]
name = "window_memory"
path = "examples/advanced/window_memory.rs"

[[example]]
name = "summary_memory"
path = "examples/advanced/summary_memory.rs"

# ── Phase 3: multi-agent example ──

[[example]]
name = "multi_agent"
