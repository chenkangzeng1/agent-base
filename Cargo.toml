[package]
name = "phi-agent"
version = "0.2.0"
edition = "2024"
description = "phi-agent — General-purpose AI Agent framework (builder factory, renderer, config, session management)"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-agent"
readme = "README.md"
keywords = ["agent", "ai", "llm", "framework", "cli"]
categories = ["development-tools", "command-line-utilities", "asynchronous"]

[[bin]]
name = "phi"
path = "src/bin/phi/main.rs"
required-features = ["tools", "telemetry", "logging"]

[dependencies]
agent-base = "0.1.7"
agent-works = "0.1.5"
phi-tools = { version = "0.1.2", optional = true }
phi-telemetry = { version = "0.1.4", optional = true }
log-core = { version = "0.1.3", optional = true }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rustyline = "15"

[features]
default = ["tools", "telemetry", "logging"]
tools = ["phi-tools"]
telemetry = ["phi-telemetry"]
logging = ["log-core"]

[dev-dependencies]
tempfile = "3"
futures-core = "0.3"
