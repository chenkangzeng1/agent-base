[package]
name = "phi-agent"
version = "0.1.0"
edition = "2024"
description = "phi-agent — General-purpose AI Agent framework (builder factory, renderer, config, session management)"

[[bin]]
name = "phi"
path = "src/bin/forge/main.rs"

[dependencies]
agent-base = { path = "../agent-base" }
agent-works = { path = "../agent-works" }
phi-tools = { path = "../phi-tools" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rustyline = "15"
log-core = { path = "../log-core" }

[dev-dependencies]
tempfile = "3"
