[package]
name = "agent-base"
version = "0.1.1"
edition = "2024"
description = "A lightweight Agent Runtime Kernel for building AI agents in Rust"
license = "MIT"
repository = "https://github.com/chenkangzeng1/agent-base"
readme = "README.md"
keywords = ["agent", "ai", "llm", "runtime", "tool-calling"]
categories = ["development-tools", "asynchronous"]

exclude = ["agent-works.md", "harness.md", "implrove-from-codex.md"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
eventsource-stream = "0.2.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = { version = "1.0.0", optional = true, features = ["preserve_order"] }
thiserror = "2.0.17"
tokio = { version = "=1.52.2", features = ["full"] }
tracing = "0.1"
opentelemetry = { version = "0.30", optional = true }
tracing-opentelemetry = { version = "0.30", optional = true }
uuid = { version = "1.10", features = ["v4"] }

[features]
default = []
typed-tools = ["schemars"]
telemetry = ["opentelemetry", "tracing-opentelemetry"]

[dev-dependencies]
dotenvy = "0.15.7"
