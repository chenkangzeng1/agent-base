[package]
name = "log-core"
version = "0.1.1"
edition = "2024"
description = "Unified logging foundation — LogSink trait + Logger combinator with terminal, file, and cloud backends"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-agent"
readme = "README.md"
keywords = ["logging", "sink", "file", "console", "tracing"]
categories = ["development-tools", "asynchronous"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.52.2", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
