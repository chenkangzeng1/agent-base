[book]
title = "phi-agent"
description = "General-purpose AI Agent Framework in Rust"
authors = ["phi-agent Contributors"]
language = "en"

[build]
build-dir = "html"

[output.html]
git-repository-url = "https://github.com/hibuka-labs/phi-agent"
edit-url-template = "https://github.com/hibuka-labs/phi-agent/edit/master/guide/{path}"
additional-js = ["theme/lang-switch.js"]

[output.html.playground]
runnable = false

[output.html.print]
enable = false
