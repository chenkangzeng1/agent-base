<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phi-agent — General-purpose AI Agent Framework in Rust</title>
    <meta name="description" content="phi-agent is a Rust framework for building AI agents. Simple, pure, predictable.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 640px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }
        .btn {
            display: inline-block;
            padding: 0.85rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s ease;
            border: 2px solid transparent;
        }
        .btn-primary {
            background: #1a1a1a;
            color: #fff;
        }
        .btn-primary:hover {
            background: #333;
        }
        .btn-secondary {
            background: #fff;
            color: #1a1a1a;
            border-color: #d4d4d4;
        }
        .btn-secondary:hover {
            border-color: #1a1a1a;
        }
        .links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .links a:hover {
            color: #1a1a1a;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1a1a1a; color: #e8e8e8; }
            .subtitle { color: #aaa; }
            .btn-primary { background: #e8e8e8; color: #1a1a1a; }
            .btn-primary:hover { background: #fff; }
            .btn-secondary { background: #2a2a2a; color: #e8e8e8; border-color: #444; }
            .btn-secondary:hover { border-color: #e8e8e8; }
            .links a { color: #888; }
            .links a:hover { color: #e8e8e8; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>phi-agent</h1>
        <p class="subtitle">
            General-purpose AI Agent Framework in Rust<br>
            Simple, pure, predictable.
        </p>
        <div class="buttons">
            <a href="en/" class="btn btn-primary">English Documentation</a>
            <a href="zh/" class="btn btn-secondary">中文文档</a>
        </div>
        <div class="links">
            <a href="https://github.com/hibuka-labs/phi-agent">GitHub</a>
            <a href="https://crates.io/crates/phi-agent">crates.io</a>
            <a href="https://docs.rs/phi-agent">docs.rs</a>
        </div>
    </div>
</body>
</html>
