site_name: phi-agent
site_description: General-purpose Rust AI Agent Framework — simple, pure, predictable. Ship your AI apps faster.
site_url: https://docs.phiagent.dev/
repo_url: https://github.com/hibuka-labs/phi-agent
repo_name: hibuka-labs/phi-agent
copyright: Copyright &copy; 2026 hibuka labs Contributors

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/lang-redirect.js

extra:
  analytics:
    provider: google
    property: G-T4W9LL7DXN
  generator: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav:
            - Home: index.md
            - Guide:
                - Quick Start: guide/getting-started.md
                - Custom Tools: guide/custom-tool.md
                - Configuration: guide/configuration.md
                - CLI Usage: guide/cli.md
                - Focus: guide/focus.md
                - Architecture: guide/architecture.md
                - Observability: guide/observability.md
                - Advanced Usage: guide/advanced.md
            - Reference:
                - API Reference: api.md
                - Community: community.md
        - locale: zh
          name: 中文
          build: true
          nav:
            - 首页: index.md
            - 指南:
                - 快速开始: guide/getting-started.md
                - 自定义工具: guide/custom-tool.md
                - 配置详解: guide/configuration.md
                - CLI 使用: guide/cli.md
                - Focus 专注判断: guide/focus.md
                - 架构设计: guide/architecture.md
                - 可观测性: guide/observability.md
                - 高级用法: guide/advanced.md
            - 参考:
                - API 参考: api.md
                - 社区: community.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
